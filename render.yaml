services:
  - type: web
    name: pendaftaran-kapita-gereja
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        sync: false
      - key: APP_STATUS
        value: PRODUCTION
      - key: APP_SERVER
        value: RENDER
